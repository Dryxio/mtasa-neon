name: Build

# Trigger the workflow on any pull request, push or manual dispatch
on: [pull_request, push, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    strategy:
      matrix:
        platform: [win32, x64, arm64]
    name: windows-${{ matrix.platform }}
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6

      # Public player builds must use MTA's anti-cheat and service checks. The
      # checked-in default remains CUSTOM so a local clone can run without an
      # installer-created HKLM registry layout. MTA's CDN network modules carry
      # an independently published official build tag, so server builds must
      # skip the exact tag comparison. CServerImpl still enforces the network
      # module ABI through CheckCompatibility before using the module.
      - name: Configure public Neon build
        shell: powershell
        run: |
          @'
          #pragma once

          #undef MTASA_VERSION_TYPE
          #define MTASA_VERSION_TYPE VERSION_TYPE_UNSTABLE
          #define MTASA_SKIP_VERSION_CHECKS
          '@ | Set-Content -LiteralPath 'Shared\build_overrides.h' -Encoding ascii

      - uses: actions/cache@v5
        id: cache-dxfiles
        with:
          path: utils/DXFiles
          key: dxfiles-0001

      - name: Download DirectX
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Invoke-WebRequest https://mirror-cdn.multitheftauto.com/bdata/DXFiles.zip -OutFile utils/DXFiles.zip
        shell: powershell

      - name: Extract DirectX
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Expand-Archive -Path utils/DXFiles.zip -DestinationPath utils/DXFiles
        shell: powershell

      - name: Install CEF
        run: utils\premake5 install_cef

      - name: Install data files
        run: utils\premake5 install_data

      - name: Run Build
        run: win-build.bat nightly ${{ matrix.platform }}
        shell: cmd
        env:
          DXSDK_DIR: './utils/DXFiles/'
          CI: 'true'

      - name: Install Windows server resources
        if: matrix.platform == 'x64'
        run: utils\premake5 install_resources

      - name: Package Neon Windows server
        if: matrix.platform == 'x64'
        shell: powershell
        run: .\utils\package-windows-server.ps1

      - name: Smoke test packaged Neon Windows server
        if: matrix.platform == 'x64'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $packageName = 'MTA-Neon-Server-Windows-x64'
          $archivePath = (Resolve-Path "$packageName.zip").Path
          $extractRoot = Join-Path $env:RUNNER_TEMP 'neon-windows-server-package'
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          & 7z x $archivePath "-o$extractRoot"
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip could not extract the server package (exit code $LASTEXITCODE)"
          }

          $serverRoot = (Resolve-Path (Join-Path $extractRoot $packageName)).Path
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'neon-server-smoke.stdout.log'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'neon-server-smoke.stderr.log'
          $process = Start-Process `
            -FilePath (Join-Path $serverRoot 'MTA Server64.exe') `
            -ArgumentList @('-u', '--port', '22103', '--httpport', '22105') `
            -WorkingDirectory $serverRoot `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath `
            -NoNewWindow `
            -PassThru

          $ready = $false
          $failure = $null
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            while ([DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Seconds 1
              $output = @(
                Get-Content -LiteralPath $stdoutPath -Raw -ErrorAction SilentlyContinue
                Get-Content -LiteralPath $stderrPath -Raw -ErrorAction SilentlyContinue
              ) -join "`n"

              if ($output -match 'Server started and is ready to accept connections!') {
                $ready = $true
                break
              }
              if ($output -match "library version is|Network module not compatible|Loading network library .* failed") {
                $failure = 'The Windows server rejected its packaged network module.'
                break
              }
              if ($process.HasExited) {
                $failure = "The Windows server exited before becoming ready (exit code $($process.ExitCode))."
                break
              }
            }
            if (-not $ready -and -not $failure) {
              $failure = 'The Windows server did not become ready within 45 seconds.'
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
            $process.WaitForExit()
            Write-Host '--- server stdout ---'
            Get-Content -LiteralPath $stdoutPath -ErrorAction SilentlyContinue
            Write-Host '--- server stderr ---'
            Get-Content -LiteralPath $stderrPath -ErrorAction SilentlyContinue
          }

          if ($failure) {
            throw $failure
          }

      - name: Create build artifacts
        run: utils\premake5 compose_files

      - name: Install NSIS
        if: matrix.platform == 'win32'
        run: choco install nsis --version=3.12.0 --yes --no-progress
        shell: powershell

      - name: Build and inspect Neon client installer
        if: matrix.platform == 'win32'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $filesRoot = (Resolve-Path 'InstallFiles').Path
          $installerRoot = (Resolve-Path 'Shared\installer').Path
          $outputDirectory = Join-Path $PWD 'InstallerOutput'
          $outputPath = Join-Path $outputDirectory 'MTA-Neon-Setup.exe'

          $requiredInputs = @(
            'Multi Theft Auto.exe',
            'MTA\core.dll',
            'MTA\netc.dll',
            'MTA\bootstrap.exe',
            'MTA\bootstrapc.exe',
            'MTA\sa.dat',
            'MTA\cgui\unifont.ttf',
            'mods\deathmatch\client.dll',
            'mods\deathmatch\lua5.1c.dll',
            'mods\deathmatch\pcre2.dll',
            'skins\Default\CGUI.xml'
          )
          foreach ($relativePath in $requiredInputs) {
            $inputPath = Join-Path $filesRoot $relativePath
            if (-not (Test-Path -LiteralPath $inputPath -PathType Leaf)) {
              throw "Installer input is missing: $relativePath"
            }
          }

          New-Item -ItemType Directory -Force -Path $outputDirectory | Out-Null
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) {
            throw "makensis.exe was not found at $makensis"
          }

          Push-Location $installerRoot
          try {
            & $makensis `
              '/DMTA_NEON' `
              '/DCLIENT_ONLY' `
              "/DFILES_ROOT=$filesRoot" `
              "/DINSTALL_OUTPUT=$outputPath" `
              "/DPRODUCT_VERSION=v1.7.0-neon-$env:GITHUB_RUN_NUMBER" `
              "/DREVISION=$env:GITHUB_RUN_NUMBER" `
              'nightly.nsi'
            if ($LASTEXITCODE -ne 0) {
              throw "makensis.exe failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf)) {
            throw 'NSIS did not produce MTA-Neon-Setup.exe'
          }

          & 7z t $outputPath
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip could not validate the installer (exit code $LASTEXITCODE)"
          }

          $archiveListing = @(& 7z l -slt $outputPath | ForEach-Object { $_ -replace '\\', '/' })
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip could not inspect the installer (exit code $LASTEXITCODE)"
          }
          $requiredInstallerContents = @(
            'Path = Multi Theft Auto.exe',
            'Path = MTA/core.dll',
            'Path = MTA/netc.dll',
            'Path = MTA/bootstrap.exe',
            'Path = MTA/bootstrapc.exe',
            'Path = MTA/sa.dat',
            'Path = MTA/cgui/unifont.ttf',
            'Path = mods/deathmatch/client.dll',
            'Path = mods/deathmatch/lua5.1c.dll',
            'Path = mods/deathmatch/pcre2.dll',
            'Path = skins/Default/CGUI.xml'
          )
          foreach ($expectedEntry in $requiredInstallerContents) {
            if ($archiveListing -notcontains $expectedEntry) {
              throw "Built installer is missing: $expectedEntry"
            }
          }

          $installer = Get-Item -LiteralPath $outputPath
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $outputPath
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          Write-Host "SHA-256: $($hash.Hash)"

      - uses: actions/upload-artifact@v6
        with:
          name: InstallFiles-${{ matrix.platform }}
          path: InstallFiles/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v6
        if: matrix.platform == 'win32'
        with:
          name: MTA-Neon-Windows-Installer
          path: InstallerOutput/MTA-Neon-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v6
        if: matrix.platform == 'x64'
        with:
          name: MTA-Neon-Windows-Server-x64
          path: MTA-Neon-Server-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  macOS:
    name: macOS
    runs-on: macOS-15
    steps:
      - uses: actions/checkout@v6

      - name: Install MySQL
        run: brew install mysql
        continue-on-error: true

      - name: Link MySQL
        run: brew link --overwrite mysql

      - name: Run Build
        run: ./linux-build.sh

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            launcher: mta-server64
          - architecture: arm64
            launcher: mta-server-arm64
    name: linux-${{ matrix.architecture }}
    runs-on: ubuntu-latest
    container:
      image: docker://ghcr.io/multitheftauto/mtasa-blue-build:latest
    steps:
      - uses: actions/checkout@v6

      # Keep local clones CUSTOM, but enable the MTA network/service behavior
      # required by the Neon server distributed to players.
      #
      # Raising the version type to UNSTABLE also switches on the core-vs-module
      # version check in CDynamicLibrary::CheckMtaVersion, which local CUSTOM
      # builds compile out. That exact tag comparison cannot pass here because
      # net.so is independently published by MTA's CDN with an official build
      # tag while this fork deliberately keeps its Neon build identity. Skip
      # that comparison through the documented escape hatch; CServerImpl still
      # enforces the network module ABI through CheckCompatibility.
      - name: Configure public Neon server build
        run: |
          printf '%s\n' \
            '#pragma once' \
            '' \
            '#undef MTASA_VERSION_TYPE' \
            '#define MTASA_VERSION_TYPE VERSION_TYPE_UNSTABLE' \
            '#define MTASA_SKIP_VERSION_CHECKS' \
            > Shared/build_overrides.h

      - name: Run Build
        run: /docker-entrypoint.sh --arch=${{ matrix.architecture }}

      - name: Prepare Linux packaging dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates unzip
          update-ca-certificates
          test -r /etc/ssl/certs/ca-certificates.crt
          command -v unzip
          command -v readelf
          command -v tar
          command -v sha256sum

      - name: Install server data and resources
        run: |
          utils/premake5 install_data
          utils/premake5 install_resources

      - name: Smoke test Neon Linux server
        if: matrix.architecture == 'x64'
        run: |
          set -eu

          log_path="$RUNNER_TEMP/neon-server-smoke.log"
          cd Bin/server
          ./mta-server64 -n -u --port 22103 --httpport 22105 >"$log_path" 2>&1 &
          server_pid=$!

          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              sleep 1
              kill -9 "$server_pid" 2>/dev/null || true
            fi
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 45); do
            if grep -Fq 'Server started and is ready to accept connections!' "$log_path"; then
              ready=1
              break
            fi
            if grep -Eq "library version is|Network module not compatible|Loading network library .* failed" "$log_path"; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          cat "$log_path"
          if [ "$ready" -ne 1 ]; then
            echo 'The Linux server did not become ready with its packaged network module.' >&2
            exit 1
          fi

      - name: Package Neon Linux server
        run: |
          set -eu

          package="MTA-Neon-Linux-Server-${{ matrix.architecture }}"
          mkdir -p "$package"

          cp -a "Bin/server/${{ matrix.launcher }}" "$package/"
          cp -a "Bin/server/${{ matrix.architecture }}" "$package/${{ matrix.architecture }}"
          cp -a "Bin/server/mods" "$package/mods"
          cp -a Server/output/LICENSE Server/output/NOTICE Server/output/README "$package/"

          required_files="
          $package/${{ matrix.launcher }}
          $package/${{ matrix.architecture }}/core.so
          $package/${{ matrix.architecture }}/deathmatch.so
          $package/${{ matrix.architecture }}/xmll.so
          $package/${{ matrix.architecture }}/dbconmy.so
          $package/${{ matrix.architecture }}/net.so
          $package/mods/deathmatch/mtaserver.conf
          $package/mods/deathmatch/acl.xml
          "
          for required_file in $required_files; do
            if [ ! -f "$required_file" ]; then
              echo "Linux server package is missing: $required_file" >&2
              exit 1
            fi
          done

          case "${{ matrix.architecture }}" in
            x64) expected_machine="Advanced Micro Devices X86-64" ;;
            arm64) expected_machine="AArch64" ;;
          esac
          elf_files="
          $package/${{ matrix.launcher }}
          $package/${{ matrix.architecture }}/core.so
          $package/${{ matrix.architecture }}/deathmatch.so
          $package/${{ matrix.architecture }}/xmll.so
          $package/${{ matrix.architecture }}/dbconmy.so
          $package/${{ matrix.architecture }}/net.so
          "
          for elf_file in $elf_files; do
            if ! readelf -h "$elf_file" | grep -F "Machine:" | grep -Fq "$expected_machine"; then
              echo "Linux server package has the wrong architecture: $elf_file" >&2
              exit 1
            fi
          done

          if [ ! -d "$package/mods/deathmatch/resources" ]; then
            echo "Linux server package is missing its resources directory" >&2
            exit 1
          fi

          chmod +x "$package/${{ matrix.launcher }}"
          tar -czf "$package.tar.gz" -C "$package" .
          tar -tzf "$package.tar.gz"
          sha256sum "$package.tar.gz"

      - uses: actions/upload-artifact@v6
        with:
          name: MTA-Neon-Linux-Server-${{ matrix.architecture }}
          path: MTA-Neon-Linux-Server-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish-latest:
    name: Publish latest Neon build
    if: github.repository == 'Dryxio/mtasa-neon' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [windows, macOS, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v6
        with:
          name: MTA-Neon-Windows-Installer
          path: ReleaseAssets

      - uses: actions/download-artifact@v6
        with:
          name: MTA-Neon-Windows-Server-x64
          path: ReleaseAssets

      - uses: actions/download-artifact@v6
        with:
          name: MTA-Neon-Linux-Server-x64
          path: ReleaseAssets

      - uses: actions/download-artifact@v6
        with:
          name: MTA-Neon-Linux-Server-arm64
          path: ReleaseAssets

      - name: Create checksums and release notes
        shell: bash
        run: |
          set -euo pipefail

          required_assets=(
            MTA-Neon-Setup.exe
            MTA-Neon-Server-Windows-x64.zip
            MTA-Neon-Linux-Server-x64.tar.gz
            MTA-Neon-Linux-Server-arm64.tar.gz
          )
          for asset in "${required_assets[@]}"; do
            test -f "ReleaseAssets/$asset"
          done

          (
            cd ReleaseAssets
            sha256sum "${required_assets[@]}" > SHA256SUMS.txt
          )

          short_sha="${GITHUB_SHA:0:9}"
          cat > ReleaseNotes.md <<EOF
          ## 🎮 Windows player

          **Download only [MTA-Neon-Setup.exe](https://github.com/$GITHUB_REPOSITORY/releases/download/neon-latest/MTA-Neon-Setup.exe).**

          Run it, select your GTA: San Andreas folder, and finish the installation. You can ignore every \`.zip\`, \`.tar.gz\`, and checksum file below.

          ## 🖥️ Server owner

          - **Windows x64:** download \`MTA-Neon-Server-Windows-x64.zip\`, extract it, edit \`mods/deathmatch/mtaserver.conf\`, then start \`MTA Server64.exe\`.
          - **Linux x64 or ARM64:** download the matching \`.tar.gz\` package.

          Client and server files in this release come from the same successful \`master\` build. Keep them together when using Neon-specific network features.

          ## Build information

          - Commit: [\`$short_sha\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)
          - Workflow run: [#$GITHUB_RUN_NUMBER](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          - Built: $(date -u +'%Y-%m-%d %H:%M UTC')

          Neon is experimental and is not affiliated with or endorsed by the Multi Theft Auto team. SHA-256 hashes are provided in \`SHA256SUMS.txt\`.
          EOF

      - name: Publish rolling Neon release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_tag='neon-latest'
          release_assets=(
            'ReleaseAssets/MTA-Neon-Setup.exe#PLAY ON WINDOWS - MTA Neon client installer'
            'ReleaseAssets/MTA-Neon-Server-Windows-x64.zip#HOST ON WINDOWS - x64 server package'
            'ReleaseAssets/MTA-Neon-Linux-Server-x64.tar.gz#HOST ON LINUX - x64 server package'
            'ReleaseAssets/MTA-Neon-Linux-Server-arm64.tar.gz#HOST ON LINUX - ARM64 server package'
            'ReleaseAssets/SHA256SUMS.txt#OPTIONAL - SHA-256 checksums'
          )
          git tag --force "$release_tag" "$GITHUB_SHA"
          git push origin "refs/tags/$release_tag" --force

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${release_assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$release_tag" \
              --title 'MTA:SA Neon — latest download' \
              --notes-file ReleaseNotes.md \
              --target "$GITHUB_SHA" \
              --prerelease=false \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release_tag" "${release_assets[@]}" \
              --title 'MTA:SA Neon — latest download' \
              --notes-file ReleaseNotes.md \
              --verify-tag \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi
