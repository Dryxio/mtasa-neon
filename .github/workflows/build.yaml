name: Build

# Pull requests and pushes build and test artifacts only. A public release is
# an explicit maintainer action from master.
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this successful master build as the public Neon update
        required: true
        type: boolean
        default: false

concurrency:
  # A push must not cancel a release which is already compiling. Concurrent
  # manual runs queue behind one another, while superseded push/PR builds can
  # still be cancelled normally.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  # The bridge is a separate Dryxio project, so public client builds must not
  # silently move when its repository advances.
  SKYGFX_BRIDGE_COMMIT: 5daf7f63f15a33cbde3f917c65dd5fce6fb498b9

jobs:
  windows:
    strategy:
      matrix:
        platform: [win32, x64, arm64]
    name: windows-${{ matrix.platform }}
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6

      - name: Check out pinned SkyGfx MTA bridge
        if: matrix.platform == 'win32'
        uses: actions/checkout@v6
        with:
          repository: Dryxio/skygfx
          ref: ${{ env.SKYGFX_BRIDGE_COMMIT }}
          path: SkyGfxBridge
          persist-credentials: false

      # Public player builds must use MTA's anti-cheat and service checks. The
      # checked-in default remains CUSTOM so a local clone can run without an
      # installer-created HKLM registry layout. MTA's CDN network modules carry
      # an independently published official build tag, so server builds must
      # skip the exact tag comparison. CServerImpl still enforces the network
      # module ABI through CheckCompatibility before using the module.
      - name: Configure public Neon build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $buildNumber = [int]$env:GITHUB_RUN_NUMBER
          if ($buildNumber -lt 1 -or $buildNumber -gt 99999) {
            throw "GITHUB_RUN_NUMBER must be between 1 and 99999, got $buildNumber"
          }

          @(
            '#pragma once'
            ''
            '#undef MTASA_VERSION_TYPE'
            '#define MTASA_VERSION_TYPE VERSION_TYPE_UNSTABLE'
            '#undef MTASA_VERSION_BUILD'
            "#define MTASA_VERSION_BUILD $buildNumber"
            '#define MTASA_SKIP_VERSION_CHECKS'
          ) | Set-Content -LiteralPath 'Shared\build_overrides.h' -Encoding ascii

      - uses: actions/cache@v5
        id: cache-dxfiles
        with:
          path: utils/DXFiles
          key: dxfiles-0001

      - name: Download DirectX
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Invoke-WebRequest https://mirror-cdn.multitheftauto.com/bdata/DXFiles.zip -OutFile utils/DXFiles.zip
        shell: powershell

      - name: Extract DirectX
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Expand-Archive -Path utils/DXFiles.zip -DestinationPath utils/DXFiles
        shell: powershell

      - name: Install CEF
        run: utils\premake5 install_cef

      - name: Install data files
        run: utils\premake5 install_data

      - name: Run Build
        run: win-build.bat nightly ${{ matrix.platform }}
        shell: cmd
        env:
          DXSDK_DIR: './utils/DXFiles/'
          CI: 'true'

      - name: Build and stage pinned SkyGfx MTA bridge
        if: matrix.platform == 'win32'
        shell: powershell
        run: |
          $sourceRoot = (Resolve-Path 'SkyGfxBridge').Path
          .\utils\build-skygfx-bridge.ps1 `
            -SourceRoot $sourceRoot `
            -ExpectedCommit $env:SKYGFX_BRIDGE_COMMIT

      - name: Install Windows server resources
        if: matrix.platform == 'x64'
        run: utils\premake5 install_resources

      - name: Package Neon Windows server
        if: matrix.platform == 'x64'
        shell: powershell
        run: .\utils\package-windows-server.ps1

      - name: Smoke test packaged Neon Windows server
        if: matrix.platform == 'x64'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $packageName = 'MTA-Neon-Server-Windows-x64'
          $archivePath = (Resolve-Path "$packageName.zip").Path
          $extractRoot = Join-Path $env:RUNNER_TEMP 'neon-windows-server-package'
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          & 7z x $archivePath "-o$extractRoot"
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip could not extract the server package (exit code $LASTEXITCODE)"
          }

          $serverRoot = (Resolve-Path (Join-Path $extractRoot $packageName)).Path
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'neon-server-smoke.stdout.log'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'neon-server-smoke.stderr.log'
          $process = Start-Process `
            -FilePath (Join-Path $serverRoot 'MTA Server64.exe') `
            -ArgumentList @('-u', '--port', '22103', '--httpport', '22105') `
            -WorkingDirectory $serverRoot `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath `
            -NoNewWindow `
            -PassThru

          $ready = $false
          $failure = $null
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            while ([DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Seconds 1
              $output = @(
                Get-Content -LiteralPath $stdoutPath -Raw -ErrorAction SilentlyContinue
                Get-Content -LiteralPath $stderrPath -Raw -ErrorAction SilentlyContinue
              ) -join "`n"

              if ($output -match 'Server started and is ready to accept connections!') {
                $ready = $true
                break
              }
              if ($output -match "library version is|Network module not compatible|Loading network library .* failed") {
                $failure = 'The Windows server rejected its packaged network module.'
                break
              }
              if ($process.HasExited) {
                $failure = "The Windows server exited before becoming ready (exit code $($process.ExitCode))."
                break
              }
            }
            if (-not $ready -and -not $failure) {
              $failure = 'The Windows server did not become ready within 45 seconds.'
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
            $process.WaitForExit()
            Write-Host '--- server stdout ---'
            Get-Content -LiteralPath $stdoutPath -ErrorAction SilentlyContinue
            Write-Host '--- server stderr ---'
            Get-Content -LiteralPath $stderrPath -ErrorAction SilentlyContinue
          }

          if ($failure) {
            throw $failure
          }

      - uses: actions/setup-node@v6
        if: matrix.platform == 'win32'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Tools/server-browser-prototype/package-lock.json

      - name: Build and validate Neon menu frontend
        if: matrix.platform == 'win32'
        working-directory: Tools/server-browser-prototype
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run build:client

      - name: Create build artifacts
        run: utils\premake5 compose_files

      - name: Install NSIS
        if: matrix.platform == 'win32'
        run: choco install nsis --version=3.12.0 --yes --no-progress
        shell: powershell

      - name: Build and inspect Neon client installer
        if: matrix.platform == 'win32'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $filesRoot = (Resolve-Path 'InstallFiles').Path
          $installerRoot = (Resolve-Path 'Shared\installer').Path
          $outputDirectory = Join-Path $PWD 'InstallerOutput'
          $outputPath = Join-Path $outputDirectory 'MTA-Neon-Setup.exe'

          $requiredInputs = @(
            'Multi Theft Auto.exe',
            'MTA\core.dll',
            'MTA\skygfx_mta.dll',
            'MTA\netc.dll',
            'MTA\vehicle-sounds\runtime\fmod.dll',
            'MTA\vehicle-sounds\runtime\fmodstudio.dll',
            'MTA\vehicle-sounds\runtime\plugins\fmod_distance_filter.dll',
            'MTA\vehicle-sounds\runtime\plugins\fmod_gain.dll',
            'MTA\bootstrap.exe',
            'MTA\bootstrapc.exe',
            'MTA\sa.dat',
            'MTA\cgui\unifont.ttf',
            'MTA\cgui\images\loadscreens\loadsc1.jpg',
            'MTA\cgui\images\loadscreens\loadsc14.jpg',
            'MTA\cef\serverbrowser\index.html',
            'MTA\cef\serverbrowser\loadscreens\loadsc1.webp',
            'MTA\cef\serverbrowser\loadscreens\loadsc14.webp',
            'mods\deathmatch\client.dll',
            'mods\deathmatch\lua5.1c.dll',
            'mods\deathmatch\pcre2.dll',
            'skins\Default\CGUI.xml'
          )
          foreach ($relativePath in $requiredInputs) {
            $inputPath = Join-Path $filesRoot $relativePath
            if (-not (Test-Path -LiteralPath $inputPath -PathType Leaf)) {
              throw "Installer input is missing: $relativePath"
            }
          }

          $expectedFmodHashes = @{
            'MTA\vehicle-sounds\runtime\fmod.dll' = 'CC352E54516D87840A6D6F49B650ADB54BA68C08EAE23C862CF87C34C304D966'
            'MTA\vehicle-sounds\runtime\fmodstudio.dll' = '266660E7DC5DE42AD0535CDF386348AADE6E7315CC8BEC36471A9A322079C599'
            'MTA\vehicle-sounds\runtime\plugins\fmod_distance_filter.dll' = '25AB3894BF4430AAF3D4AD356D554DD6CDEB216A9E1575F3225AE4DEE0F9BAB8'
            'MTA\vehicle-sounds\runtime\plugins\fmod_gain.dll' = '075B058F2F56C710102873DF490A2D0E5417D6B518D0C123560F84A34CE37B18'
          }
          foreach ($relativePath in $expectedFmodHashes.Keys) {
            $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $filesRoot $relativePath)).Hash
            if ($actualHash -ne $expectedFmodHashes[$relativePath]) {
              throw "Installer FMOD runtime hash mismatch: $relativePath"
            }
          }

          $webAssetsRoot = Join-Path $filesRoot 'MTA\cef\serverbrowser\assets'
          foreach ($extension in @('js', 'css', 'ttf')) {
            if (-not (Get-ChildItem -LiteralPath $webAssetsRoot -File -Filter "*.$extension")) {
              throw "Installer input has no Neon menu *.$extension asset"
            }
          }

          $webLoadscreens = @(Get-ChildItem -LiteralPath (Join-Path $filesRoot 'MTA\cef\serverbrowser\loadscreens') -File -Filter 'loadsc*.webp')
          if ($webLoadscreens.Count -ne 14) {
            throw "Installer input must contain 14 web load screens, found $($webLoadscreens.Count)"
          }

          $nativeLoadscreens = @(Get-ChildItem -LiteralPath (Join-Path $filesRoot 'MTA\cgui\images\loadscreens') -File -Filter 'loadsc*.jpg')
          if ($nativeLoadscreens.Count -ne 14) {
            throw "Installer input must contain 14 native load screens, found $($nativeLoadscreens.Count)"
          }

          New-Item -ItemType Directory -Force -Path $outputDirectory | Out-Null
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) {
            throw "makensis.exe was not found at $makensis"
          }

          Push-Location $installerRoot
          try {
            & $makensis `
              '/DMTA_NEON' `
              '/DCLIENT_ONLY' `
              "/DFILES_ROOT=$filesRoot" `
              "/DINSTALL_OUTPUT=$outputPath" `
              "/DPRODUCT_VERSION=v1.7.0-neon-$env:GITHUB_RUN_NUMBER" `
              "/DREVISION=$env:GITHUB_RUN_NUMBER" `
              'nightly.nsi'
            if ($LASTEXITCODE -ne 0) {
              throw "makensis.exe failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf)) {
            throw 'NSIS did not produce MTA-Neon-Setup.exe'
          }

          & 7z t $outputPath
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip could not validate the installer (exit code $LASTEXITCODE)"
          }

          $archiveListing = @(& 7z l -slt $outputPath | ForEach-Object { $_ -replace '\\', '/' })
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip could not inspect the installer (exit code $LASTEXITCODE)"
          }
          $requiredInstallerContents = @(
            'Path = Multi Theft Auto.exe',
            'Path = MTA/core.dll',
            'Path = MTA/skygfx_mta.dll',
            'Path = MTA/netc.dll',
            'Path = MTA/vehicle-sounds/runtime/fmod.dll',
            'Path = MTA/vehicle-sounds/runtime/fmodstudio.dll',
            'Path = MTA/vehicle-sounds/runtime/FMOD-NOTICE.txt',
            'Path = MTA/vehicle-sounds/runtime/plugins/fmod_distance_filter.dll',
            'Path = MTA/vehicle-sounds/runtime/plugins/fmod_gain.dll',
            'Path = MTA/bootstrap.exe',
            'Path = MTA/bootstrapc.exe',
            'Path = MTA/sa.dat',
            'Path = MTA/cgui/unifont.ttf',
            'Path = MTA/cef/serverbrowser/index.html',
            'Path = mods/deathmatch/client.dll',
            'Path = mods/deathmatch/lua5.1c.dll',
            'Path = mods/deathmatch/pcre2.dll',
            'Path = skins/Default/CGUI.xml'
          )
          foreach ($expectedEntry in $requiredInstallerContents) {
            if ($archiveListing -notcontains $expectedEntry) {
              throw "Built installer is missing: $expectedEntry"
            }
          }

          $requiredInstallerPatterns = @{
            'Neon menu JavaScript' = '^Path = MTA/cef/serverbrowser/assets/.+\.js$'
            'Neon menu CSS' = '^Path = MTA/cef/serverbrowser/assets/.+\.css$'
            'Neon menu fonts' = '^Path = MTA/cef/serverbrowser/assets/.+\.ttf$'
          }
          foreach ($label in $requiredInstallerPatterns.Keys) {
            if (-not ($archiveListing -match $requiredInstallerPatterns[$label])) {
              throw "Built installer is missing: $label"
            }
          }

          $installedWebLoadscreens = @($archiveListing | Where-Object { $_ -match '^Path = MTA/cef/serverbrowser/loadscreens/loadsc(?:[1-9]|1[0-4])\.webp$' })
          if ($installedWebLoadscreens.Count -ne 14) {
            throw "Built installer must contain 14 web load screens, found $($installedWebLoadscreens.Count)"
          }

          $installedNativeLoadscreens = @($archiveListing | Where-Object { $_ -match '^Path = MTA/cgui/images/loadscreens/loadsc(?:[1-9]|1[0-4])\.jpg$' })
          if ($installedNativeLoadscreens.Count -ne 14) {
            throw "Built installer must contain 14 native load screens, found $($installedNativeLoadscreens.Count)"
          }

          $installer = Get-Item -LiteralPath $outputPath
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $outputPath
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          Write-Host "SHA-256: $($hash.Hash)"

      - uses: actions/upload-artifact@v6
        with:
          name: InstallFiles-${{ matrix.platform }}
          path: InstallFiles/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v6
        if: matrix.platform == 'win32'
        with:
          name: MTA-Neon-Windows-Installer
          path: InstallerOutput/MTA-Neon-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v6
        if: matrix.platform == 'x64'
        with:
          name: MTA-Neon-Windows-Server-x64
          path: MTA-Neon-Server-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  macOS:
    name: macOS
    runs-on: macOS-15
    steps:
      - uses: actions/checkout@v6

      - name: Install MySQL
        run: brew install mysql
        continue-on-error: true

      - name: Link MySQL
        run: brew link --overwrite mysql

      - name: Run Build
        run: ./linux-build.sh

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            launcher: mta-server64
          - architecture: arm64
            launcher: mta-server-arm64
    name: linux-${{ matrix.architecture }}
    runs-on: ubuntu-latest
    container:
      image: docker://ghcr.io/multitheftauto/mtasa-blue-build:latest
    steps:
      - uses: actions/checkout@v6

      # Keep local clones CUSTOM, but enable the MTA network/service behavior
      # required by the Neon server distributed to players.
      #
      # Raising the version type to UNSTABLE also switches on the core-vs-module
      # version check in CDynamicLibrary::CheckMtaVersion, which local CUSTOM
      # builds compile out. That exact tag comparison cannot pass here because
      # net.so is independently published by MTA's CDN with an official build
      # tag while this fork deliberately keeps its Neon build identity. Skip
      # that comparison through the documented escape hatch; CServerImpl still
      # enforces the network module ABI through CheckCompatibility.
      - name: Configure public Neon server build
        run: |
          set -eu

          if [[ ! "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]{0,4}$ ]]; then
            echo "GITHUB_RUN_NUMBER must be between 1 and 99999, got $GITHUB_RUN_NUMBER" >&2
            exit 1
          fi

          printf '%s\n' \
            '#pragma once' \
            '' \
            '#undef MTASA_VERSION_TYPE' \
            '#define MTASA_VERSION_TYPE VERSION_TYPE_UNSTABLE' \
            '#undef MTASA_VERSION_BUILD' \
            "#define MTASA_VERSION_BUILD $GITHUB_RUN_NUMBER" \
            '#define MTASA_SKIP_VERSION_CHECKS' \
            > Shared/build_overrides.h

      - name: Run Build
        run: /docker-entrypoint.sh --arch=${{ matrix.architecture }}

      - name: Prepare Linux packaging dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates unzip
          update-ca-certificates
          test -r /etc/ssl/certs/ca-certificates.crt
          command -v unzip
          command -v readelf
          command -v tar
          command -v sha256sum

      - name: Install server data and resources
        run: |
          utils/premake5 install_data
          utils/premake5 install_resources

      - name: Smoke test Neon Linux server
        if: matrix.architecture == 'x64'
        run: |
          set -eu

          log_path="$RUNNER_TEMP/neon-server-smoke.log"
          cd Bin/server
          ./mta-server64 -n -u --port 22103 --httpport 22105 >"$log_path" 2>&1 &
          server_pid=$!

          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              sleep 1
              kill -9 "$server_pid" 2>/dev/null || true
            fi
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 45); do
            if grep -Fq 'Server started and is ready to accept connections!' "$log_path"; then
              ready=1
              break
            fi
            if grep -Eq "library version is|Network module not compatible|Loading network library .* failed" "$log_path"; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          cat "$log_path"
          if [ "$ready" -ne 1 ]; then
            echo 'The Linux server did not become ready with its packaged network module.' >&2
            exit 1
          fi

      - name: Package Neon Linux server
        run: |
          set -eu

          package="MTA-Neon-Linux-Server-${{ matrix.architecture }}"
          mkdir -p "$package"

          cp -a "Bin/server/${{ matrix.launcher }}" "$package/"
          cp -a "Bin/server/${{ matrix.architecture }}" "$package/${{ matrix.architecture }}"
          cp -a "Bin/server/mods" "$package/mods"
          cp -a Server/output/LICENSE Server/output/NOTICE Server/output/README "$package/"

          required_files="
          $package/${{ matrix.launcher }}
          $package/${{ matrix.architecture }}/core.so
          $package/${{ matrix.architecture }}/deathmatch.so
          $package/${{ matrix.architecture }}/xmll.so
          $package/${{ matrix.architecture }}/dbconmy.so
          $package/${{ matrix.architecture }}/net.so
          $package/mods/deathmatch/mtaserver.conf
          $package/mods/deathmatch/acl.xml
          "
          for required_file in $required_files; do
            if [ ! -f "$required_file" ]; then
              echo "Linux server package is missing: $required_file" >&2
              exit 1
            fi
          done

          case "${{ matrix.architecture }}" in
            x64) expected_machine="Advanced Micro Devices X86-64" ;;
            arm64) expected_machine="AArch64" ;;
          esac
          elf_files="
          $package/${{ matrix.launcher }}
          $package/${{ matrix.architecture }}/core.so
          $package/${{ matrix.architecture }}/deathmatch.so
          $package/${{ matrix.architecture }}/xmll.so
          $package/${{ matrix.architecture }}/dbconmy.so
          $package/${{ matrix.architecture }}/net.so
          "
          for elf_file in $elf_files; do
            if ! readelf -h "$elf_file" | grep -F "Machine:" | grep -Fq "$expected_machine"; then
              echo "Linux server package has the wrong architecture: $elf_file" >&2
              exit 1
            fi
          done

          if [ ! -d "$package/mods/deathmatch/resources" ]; then
            echo "Linux server package is missing its resources directory" >&2
            exit 1
          fi

          chmod +x "$package/${{ matrix.launcher }}"
          tar -czf "$package.tar.gz" -C "$package" .
          tar -tzf "$package.tar.gz"
          sha256sum "$package.tar.gz"

      - uses: actions/upload-artifact@v6
        with:
          name: MTA-Neon-Linux-Server-${{ matrix.architecture }}
          path: MTA-Neon-Linux-Server-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  neon-updater-manifest:
    name: Test Neon update manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run strict manifest tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s utils/neon-updater -p 'test_*.py' -v
          python3 utils/neon-updater/manifest.py --help >/dev/null

  publish-latest:
    name: Publish approved Neon release
    if: github.repository == 'Dryxio/mtasa-neon' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.publish_release == true
    needs: [windows, macOS, linux, neon-updater-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v6
        with:
          name: MTA-Neon-Windows-Installer
          path: ReleaseAssets

      - uses: actions/download-artifact@v6
        with:
          name: MTA-Neon-Windows-Server-x64
          path: ReleaseAssets

      - uses: actions/download-artifact@v6
        with:
          name: MTA-Neon-Linux-Server-x64
          path: ReleaseAssets

      - uses: actions/download-artifact@v6
        with:
          name: MTA-Neon-Linux-Server-arm64
          path: ReleaseAssets

      - name: Create checksums and release metadata
        id: release_metadata
        shell: bash
        run: |
          set -euo pipefail

          required_assets=(
            MTA-Neon-Setup.exe
            MTA-Neon-Server-Windows-x64.zip
            MTA-Neon-Linux-Server-x64.tar.gz
            MTA-Neon-Linux-Server-arm64.tar.gz
          )
          for asset in "${required_assets[@]}"; do
            test -f "ReleaseAssets/$asset"
          done

          (
            cd ReleaseAssets
            sha256sum "${required_assets[@]}" > SHA256SUMS.txt
          )

          if [[ ! "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]{0,4}$ ]]; then
            echo "GITHUB_RUN_NUMBER must be between 1 and 99999, got $GITHUB_RUN_NUMBER" >&2
            exit 1
          fi

          short_sha="${GITHUB_SHA:0:9}"
          build_date="$(date -u +'%Y-%m-%d %H:%M UTC')"
          version_date="$(date -u +'%Y.%m.%d')"
          display_version="${version_date}.${GITHUB_RUN_NUMBER}"
          printf -v padded_build '%05d' "$GITHUB_RUN_NUMBER"
          technical_version="1.7.0-5.${padded_build}"
          release_tag="neon-${display_version}"
          release_title="MTA:SA Neon — ${display_version}"
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'title=%s\n' "$release_title" >> "$GITHUB_OUTPUT"
          printf 'display_version=%s\n' "$display_version" >> "$GITHUB_OUTPUT"
          printf 'technical_version=%s\n' "$technical_version" >> "$GITHUB_OUTPUT"

          cat > ReleaseNotes.md <<EOF
          ## 🎮 Windows player

          **Download only [MTA-Neon-Setup.exe](https://github.com/$GITHUB_REPOSITORY/releases/latest/download/MTA-Neon-Setup.exe).**

          Run it, select your GTA: San Andreas folder, and finish the installation. You can ignore every \`.zip\`, \`.tar.gz\`, and checksum file below.

          ## 🖥️ Server owner

          - **Windows x64:** download \`MTA-Neon-Server-Windows-x64.zip\`, extract it, edit \`mods/deathmatch/mtaserver.conf\`, then start \`MTA Server64.exe\`.
          - **Linux x64 or ARM64:** download the matching \`.tar.gz\` package.

          Client and server files in this release come from the same successful \`master\` build. Keep them together when using Neon-specific network features.

          ## Build information

          - Built: $build_date
          - Public version: \`Neon $display_version\`
          - Technical client version: \`$technical_version\`
          - Commit: [\`$short_sha\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)
          - Workflow run: [#$GITHUB_RUN_NUMBER](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          Neon is experimental and is not affiliated with or endorsed by the Multi Theft Auto team. SHA-256 hashes are provided in \`SHA256SUMS.txt\`.
          EOF

      - name: Refuse a duplicate release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to replace existing tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace existing release: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Create and verify signed Neon update manifest
        shell: bash
        env:
          NEON_UPDATE_SIGNING_KEY_B64: ${{ secrets.NEON_UPDATE_SIGNING_KEY_B64 }}
          PYTHONDONTWRITEBYTECODE: '1'
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
          DISPLAY_VERSION: ${{ steps.release_metadata.outputs.display_version }}
          TECHNICAL_VERSION: ${{ steps.release_metadata.outputs.technical_version }}
        run: |
          set -euo pipefail

          if [[ -z "$NEON_UPDATE_SIGNING_KEY_B64" ]]; then
            echo 'NEON_UPDATE_SIGNING_KEY_B64 is required to publish an update.' >&2
            exit 1
          fi

          : "${RUNNER_TEMP:?RUNNER_TEMP must identify the GitHub temporary directory}"
          if [[ ! -d "$RUNNER_TEMP" || -L "$RUNNER_TEMP" ]]; then
            echo 'RUNNER_TEMP must be an existing directory, not a symbolic link.' >&2
            exit 1
          fi
          runner_temp="$(realpath -e -- "$RUNNER_TEMP")"
          signing_key="${runner_temp}/neon-update-signing-key.pem"
          expected_signing_key="${runner_temp}/neon-update-signing-key.pem"
          if [[ "$signing_key" != "$expected_signing_key" || -e "$signing_key" || -L "$signing_key" ]]; then
            echo 'Refusing an unexpected or pre-existing signing key path.' >&2
            exit 1
          fi
          cleanup() {
            if [[ "$signing_key" != "$expected_signing_key" || -L "$signing_key" ]]; then
              echo 'Refusing to clean an unexpected or symbolic-link signing key path.' >&2
              return
            fi
            rm -f -- "$signing_key"
          }
          trap cleanup EXIT
          umask 077
          if ! printf '%s' "$NEON_UPDATE_SIGNING_KEY_B64" | base64 --decode > "$signing_key"; then
            echo 'NEON_UPDATE_SIGNING_KEY_B64 is not valid base64.' >&2
            exit 1
          fi
          if [[ ! -s "$signing_key" ]]; then
            echo 'Decoded Neon update signing key is empty.' >&2
            exit 1
          fi

          python3 utils/neon-updater/manifest.py create \
            --private-key "$signing_key" \
            --expected-public-key-base64url 'oc55WO1PYJFiyipKMTAoDR-nVPLgUZ7bgyDfvl3WhsI' \
            --repository "$GITHUB_REPOSITORY" \
            --build "$GITHUB_RUN_NUMBER" \
            --display-version "$DISPLAY_VERSION" \
            --technical-version "$TECHNICAL_VERSION" \
            --release-tag "$RELEASE_TAG" \
            --key-id 'neon-release-2026-01' \
            --asset ReleaseAssets/MTA-Neon-Setup.exe \
            --output ReleaseAssets/MTA-Neon-Update.xml

          python3 utils/neon-updater/manifest.py verify \
            --public-key-base64url 'oc55WO1PYJFiyipKMTAoDR-nVPLgUZ7bgyDfvl3WhsI' \
            --repository "$GITHUB_REPOSITORY" \
            --manifest ReleaseAssets/MTA-Neon-Update.xml \
            --asset ReleaseAssets/MTA-Neon-Setup.exe

          (
            cd ReleaseAssets
            sha256sum MTA-Neon-Update.xml >> SHA256SUMS.txt
          )

      - name: Publish unique Neon release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release_metadata.outputs.title }}
        run: |
          set -euo pipefail

          release_tag="$RELEASE_TAG"
          release_assets=(
            'ReleaseAssets/MTA-Neon-Setup.exe#PLAY ON WINDOWS - MTA Neon client installer'
            'ReleaseAssets/MTA-Neon-Server-Windows-x64.zip#HOST ON WINDOWS - x64 server package'
            'ReleaseAssets/MTA-Neon-Linux-Server-x64.tar.gz#HOST ON LINUX - x64 server package'
            'ReleaseAssets/MTA-Neon-Linux-Server-arm64.tar.gz#HOST ON LINUX - ARM64 server package'
            'ReleaseAssets/MTA-Neon-Update.xml#SIGNED AUTO-UPDATER MANIFEST - do not install manually'
            'ReleaseAssets/SHA256SUMS.txt#OPTIONAL - SHA-256 checksums'
          )

          if [[ ! "$release_tag" =~ ^neon-[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]{0,4}$ ]]; then
            echo "Refusing unexpected release tag: $release_tag" >&2
            exit 1
          fi

          git tag "$release_tag" "$GITHUB_SHA"
          git push origin "refs/tags/$release_tag"

          gh release create "$release_tag" "${release_assets[@]}" \
            --title "$RELEASE_TITLE" \
            --notes-file ReleaseNotes.md \
            --verify-tag \
            --latest \
            --repo "$GITHUB_REPOSITORY"

      - name: Keep the 10 newest Neon build releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
        run: |
          set -euo pipefail

          mapfile -t build_tags < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name | test("^neon-[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}\\.[1-9][0-9]{0,4}$")) | [.published_at, .tag_name] | @tsv' \
              | sort --reverse \
              | cut -f2
          )

          stale_tags=("${build_tags[@]:10}")
          for stale_tag in "${stale_tags[@]}"; do
            if [[ -z "$stale_tag" || "$stale_tag" == "$RELEASE_TAG" || ! "$stale_tag" =~ ^neon-[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]{0,4}$ ]]; then
              echo "Refusing unexpected cleanup target: $stale_tag" >&2
              exit 1
            fi

            gh release view "$stale_tag" --repo "$GITHUB_REPOSITORY" >/dev/null
            echo "Removing superseded Neon build release: $stale_tag"
            gh release delete "$stale_tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
          done
