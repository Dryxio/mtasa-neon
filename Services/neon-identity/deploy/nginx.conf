server {
    listen 80;
    listen [::]:80;
    server_name identity.mta-neon.com;

    # OAuth callbacks carry short-lived authorization codes in their query
    # string. Disabling the proxy access log prevents those codes from being
    # copied into the global Nginx combined log.
    access_log off;

    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
